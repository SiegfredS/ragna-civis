[project]
name = "api"
version = "0.1.0"
description = ""
authors = [
    {name = "SiegfredS",email = "wcsarita@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django (>=6.1,<7.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[tool.poetry.group.dev.dependencies]
ruff = "^0.16.4"
pre-commit = "^4.6.2"
django-stubs = {extras = ["compatible-mypy"], version = "^6.1.0"}
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
factory-boy = "^3.3.3"
pytest-django = "^4.11.1"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--ds=config.settings.test"
pythonpath = ["."]
testpaths = ["apps"]
python_files = ["test_*.py", "*_test.py", "tests.py"]


[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # import sorting
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.local"
