services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragna}
      POSTGRES_USER: ${POSTGRES_USER:-ragna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragna}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ragna-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragna} -d ${POSTGRES_DB:-ragna}",]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./api
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./api/.env
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./api:/app
      # Prevent the host Poetry virtualenv from being used inside Docker.
      - api-venv-mask:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules


volumes:
  ragna-postgres-data:
  api-venv-mask:
  web_node_modules:
